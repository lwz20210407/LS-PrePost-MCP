# LS-PrePost-MCP 任务目录（单一事实源）
#
# 用途：
#   1. 定义"做完"的分母：v0.5 只以本文件中 release: v0.5 的任务计算进度。
#   2. 生成 docs/TASKS.md、README 能力表、COMPATIBILITY 矩阵（由 tools/gen_docs.py 生成，禁止手改生成物）。
#   3. 每个开发项必须能指向这里的一个任务 ID 或 infrastructure ID；指不到的不做。
#
# 规则：
#   - 冻结后，任务的增删、release 变更只能在里程碑结束时进行，并在 change_log 记录原因。
#   - status 只能因证据变化而改变：done 必须附 L2（必要时 L3）证据路径。
#   - 里程碑进行中出现的新需求写入 backlog.md，不直接改本文件。
#   - 本文件可以公开：不得写入私有模型路径、私有数据、用户课程内容。
#   - ui_entry 已按 4.13.4 菜单截图核正到可证实的入口；不据此宣称面板内全部子项已验收。

schema_version: 1
product: >-
  LS-PrePost-MCP：让任意 AI Agent 通过 MCP 可靠地驱动 LS-PrePost 完成 LS-DYNA 前后处理，
  每一步都有可核查的结果。
frozen_release: v0.5
frozen_on: 2026-10-05
baseline_commit: ce4cd51            # 评审基于 32bb06d；其后 6 个提交（节点力、质量单元保留）已并入本文件
primary_version: "4.13"            # D3：4.13 主力；4.10 回归子集；4.8 尽力

decisions:                         # 2026-10-05 用户确认，全部采纳
  D1: 执行以批处理为主（BatchEngine），常驻会话为辅；可见 GUI 只作观察模式。会话的触发方式由 E1-E5 实验决定。
  D2: 后处理数值允许走 LASSO / LS-Reader，必须标注后端并与 LSPP 在回归语料上交叉校验；渲染与 LSPP 派生量走原生。
  D3: 4.13 全量验证；4.10 跑回归子集；4.8 按能力探测尽力开放；4.11 排除。
  D4: v0.5 范围 = 本文件 release=v0.5 的任务。
  D5: 在 restructure/v0.5 分支渐进重组；保留已验证原生命令、坑记录、结果数学、产物校验与逻辑测试。不推倒重来。
  D6: 不回退到 Malps-del 作为基础，只借鉴其 cfile 模板白名单思路（即 T2 配方）。
  D7: 仓库保持 Private，M4 退出标准满足后由用户决定是否公开。

status_values:
  todo: 未实现，或现有实现不可作为基础
  partial: 有实现，但范围不足或缺少 L2 回归证据（gaps 中列出）
  done: 本任务全部 acceptance 在 L2 原生回归中通过（标注 L3 的需同时通过 L3）

evidence_levels:
  L1: 单元/逻辑测试（CI，不启动 LSPP）
  L2: 原生回归（pytest -m native，固定语料，真跑 LSPP 4.13；4.10 子集另标）
  L3: Agent 场景评测（自然语言任务经 MCP 完成）

layers:
  T1: 类型化任务工具：严格参数、语义合同、结果带元数据
  T2: 已验证配方：recipe.yaml + 模板（cfile/.mac/py/scl）+ 输出检查 + 一个 L2 用例；用 find_recipe/run_recipe 调用
  T3: 自由脚本：Agent 查知识库后自己写，经 run_script 执行，再用观察/验证工具核对

# 原生命令流通道：A01-A05 共用同一个 run_script 接口。
# 每个通道在 batch 与 session 两种上下文中分别验收。
channels:
  command:
    what: 单条原生命令，等价于 GUI 左下角命令输入栏
    batch: 写入一次性 cfile 执行
    session: 送入会话命令通道（现为 Win32 写命令框，待 E1-E5 决定是否改为 bridge 轮询）
  cfile:
    what: 多行命令流文件（含 GUI 自动记录的 lspost.cfile）
    batch: runc= 或 c= -nographics（按配方登记哪种可用）
    session: openc command <file> nodialog
  scl:
    what: SCL 脚本，经 runscript 执行
  python:
    what: 应用内 Python（DataCenter / LsPrePost），经 runpython 执行；不是外部 MCP 的 Python
  macro:
    what: 原生宏 .mac 文件：*macro begin/end、parameter 默认值、&name / &{name} 引用、(n/e/p) 拾取域
    note: 仓库现有 create_native_macro / run_native_macro 是自定义 JSON 模板，不是 LSPP 原生宏，M1 中改名并入配方库（A08）

# 执行规则：
#   - 测试人员：M0、M1 期间每个 milestone 最多一个 GUI 时间窗，由用户在场。
#   - acceptance 中出现的语料 ID（corpus:*）在 tests/corpus/manifest.yaml 中定义（M0 建立）。

milestones:
  - id: M0
    name: 止血与准备
    tasks: []
    infrastructure: [I06, I10, I11]
    exit:
      - tasks.yaml 入库，校验脚本进 CI，docs/TASKS.md 由它生成
      - docs 顶层不超过 12 份，其余 git mv 到 docs/archive/2026-10/；README 改为说明书结构
      - KNOWN_ISSUES.md 收齐全部原生坑，每条注明来源文档
      - uv run pytest 通过（不装可选依赖时相关测试 skip 而非 fail）；validate_model_references 合同 bug 修复并有回归测试
      - E1-E5 实验与批处理通道矩阵有记录，会话传输决策写入 ADR；用户确认将剩余 13 个 UU 远程 runc/原生宏格转入 I04，不作为 M0 退出条件
      - tests/corpus/manifest.yaml 建立，全部现有工具（138 服务 + 4 知识）的迁移映射表完成
      - SKILL.md 改为"意图 → 工具"路由表（不超过 150 行），更新日志式内容移入 CHANGELOG
      - M0 不新增任何 MCP 工具或功能
  - id: M1
    name: 底座
    tasks: [A01, A02, A03, A04, A05, A08, A10]
    infrastructure: [I01, I02, I03, I04, I05, I08]
    exit:
      - 现有手动原生验收（tools/run_*）全部迁入 pytest -m native 并在新引擎上通过
      - 五个通道统一到 run_script，batch/session 两种上下文都有 L2 用例
      - 至少 5 个示范配方；search_docs 可查命令 / API / 关键字字段
      - import-linter 生效，src 中不再有函数内 from .service import
  - id: M2
    name: 后处理任务包
    tasks: [Q01, Q02, Q03, Q04, Q05, Q06, Q07, Q08, Q09, Q12, G01, G04]
    infrastructure: [I09]
    exit:
      - 本里程碑任务全部 done
      - L3 后处理 8 题至少 7 题成功
  - id: M3
    name: 前处理任务包
    tasks: [P01, P02, P03, P04, P05, P06, P08, P09, P10, P11, G03]
    infrastructure: [I07]
    exit:
      - 本里程碑任务全部 done
      - L3 前处理 8 题至少 6 题成功
  - id: M4
    name: 自动化与发布
    tasks: [A07, A09]
    infrastructure: [I09]
    exit:
      - v0.5 全部任务 done
      - L3 20 题至少 16 题成功
      - 干净环境按 README / INSTALL 步骤可装好并跑通示例
      - Skill 完整重写：路由表 + 每类任务 SOP（必填参数、工具、验证方法、何时拒答）

# ---------------------------------------------------------------------------
# 用户任务
# ---------------------------------------------------------------------------
tasks:

  # ============================ 前处理 ============================
  - id: P01
    group: pre
    title: 模型检视
    story: 打开这个 k 文件，告诉我有哪些部件、材料、截面、集合、单元类型和数量，以及 Include 结构
    ui_entry: ["FEM > Model and Part > Assembly and Select Part", "FEM > Model and Part > Keyword Manager", "File > Open > LS-DYNA Keyword File"]
    release: v0.5
    milestone: M3
    layer: T1
    target_tools: [open_model, model_info]
    status: partial
    existing: [inspect_model, inspect_keyword_deck, list_parts, list_nodes, inspect_gui_mesh]
    gaps:
      - 读取入口分散在 6 个工具，返回格式各异
      - 不输出 Include 树、材料/截面/Part 关联、集合清单
    acceptance:
      - corpus:include_contact 上返回部件/材料/截面/集合/单元类型计数，与 LSPP Keyword Manager 读回一致
      - 返回 Include 树（文件、相对路径、层级），与源文件结构一致
      - 只读：输入文件哈希不变
      - 超过 30 万单元的模型在 60 s 内返回摘要（corpus:large_private，私有语料）

  - id: P02
    group: pre
    title: 关键字卡片读改增删（Include 保真）
    story: 把 Part 3 的材料换成 MAT_024 并改屈服应力，保存，Include 文件结构不要动
    ui_entry: ["FEM > Model and Part > Keyword Manager"]
    release: v0.5
    milestone: M3
    layer: T1
    target_tools: [edit_keywords]
    depends_on: [I07]
    status: todo
    existing: [update_keyword_fields, update_keyword_table_row, compose_keyword_deck]
    gaps:
      - model_deck.py 遇到 *INCLUDE / *PARAMETER 直接拒绝
      - PyDYNA 路线整 deck 重写，注释与格式丢失；只能改唯一匹配的卡
      - 不能向已有模型追加卡片
    acceptance:
      - corpus:include_contact 上改一张卡的一个字段，保存后只有该卡所在文件变化，其余文件字节级不变
      - 被改文件中未改动的卡逐字节不变（含注释、空行、字段宽度）
      - 新增一张卡片插入到指定文件的指定位置，字段宽度符合关键字定义
      - 删除一张卡后引用检查报告悬空引用，不静默删除被引用对象
      - 含 *PARAMETER 的字段可读出表达式原文与求值结果
      - 保存后 LSPP 原生重开，实体计数与编辑前预期一致

  - id: P03
    group: pre
    title: 材料 / 截面 / Part 创建与关联
    story: 新建一个 MAT_015 Johnson-Cook 材料和实体截面，赋给 Part 5
    ui_entry: ["FEM > Model and Part > Keyword Manager", "FEM > Model and Part > Part Data"]
    release: v0.5
    milestone: M3
    layer: T1+T2
    target_tools: [edit_keywords, run_recipe]
    depends_on: [P02]
    status: partial
    existing: [create_elastic_material, update_elastic_material, move_elements_to_part]
    gaps:
      - 只支持 MAT_001
      - 不能设置 Part 的 SECID / MID / EOSID / HGID
    acceptance:
      - 常用材料族 MAT_001/003/015/020/024/098 及 EOS 至少各一个配方，字段名来自关键字定义
      - Part 关联修改后引用检查通过，原生重开后 Part Data 读回一致
      - 单位制由调用者声明；缺少单位时拒绝生成需要单位的默认值

  - id: P04
    group: pre
    title: 集合创建
    story: 把 z=0 平面上的节点做成节点集；把弹体外表面做成 Segment 集
    ui_entry: ["FEM > Model and Part > Create Entity > Set Data", "FEM > Model and Part > Assembly and Select Part"]
    release: v0.5
    milestone: M3
    layer: T1
    target_tools: [create_entities]
    depends_on: [G03]
    status: partial
    existing: [create_gui_entity_set, create_gui_segment_set, create_node_set_by_box, inspect_gui_entity_sets]
