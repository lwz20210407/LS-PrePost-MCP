    existing: [translate_gui_nodes, rotate_gui_nodes, set_gui_node_coordinates, merge_gui_duplicate_nodes, reverse_gui_shell_normals, renumber_gui_entities, create_gui_nodes, create_gui_elements, replace_gui_node, translate_mesh_nodes, rotate_mesh_nodes, transform_mesh_deck, merge_duplicate_mesh_nodes, move_elements_to_part]
    gaps:
