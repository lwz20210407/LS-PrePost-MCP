name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_DOWNLOADS: never
      UV_CACHE_DIR: ${{ runner.temp }}/lspp-uv-cache
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/lspp-test-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check --only-binary=:all: uv==0.11.16
        timeout-minutes: 5
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra results --extra pydyna
        timeout-minutes: 8
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python tools/validate_development_plan.py
      - run: uv run --no-sync python tools/run_workflow_gate_acceptance.py --workspace "${{ runner.temp }}/lspp-workflow-gates"
