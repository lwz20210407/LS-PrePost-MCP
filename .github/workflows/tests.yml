name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure isolated environment paths
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("UV_CACHE_DIR=" + str(root / "lspp-uv-cache") + "\n")
              stream.write("UV_PROJECT_ENVIRONMENT=" + str(root / "lspp-test-env") + "\n")
      - name: Install pinned uv
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: uv==0.11.16
        timeout-minutes: 5
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra results --extra pydyna
        timeout-minutes: 8
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync lint-imports --no-cache
      - run: uv run --no-sync python tools/validate_tasks.py
      - run: uv run --no-sync python tools/gen_docs.py --check
      - run: uv run --no-sync python tools/validate_tool_migration.py
      - run: uv run --no-sync python tools/fetch_corpus.py --check-registry
      - run: uv run --no-sync python tools/check_doc_links.py
      - name: Run migrated file acceptance and generate report
        run: >-
          uv run --no-sync python -m pytest tests/test_native_acceptance.py -m native
          -k "engineering_unit or workflow_gate or parameter_study_acceptance.file"
          --run-native --native-strict --native-output "${{ runner.temp }}/lspp-native-file"
