schema_version: 1
id: section_cut_fringe
name: 截面剖切云图
task_id: Q10
channel: cfile
template: template.cfile
description: 截面剖切云图；剖切面基准位置与法向可设，原模型数值，不做单位换算或工程质量判断。
parameters:
  type: object
  properties:
    px:
      type: number
      default: 0.0
      description: 剖切面基准点 X 坐标
    py:
      type: number
      default: 0.0
      description: 剖切面基准点 Y 坐标
    pz:
      type: number
      default: 0.0
      description: 剖切面基准点 Z 坐标
    nx:
      type: number
      default: 1.0
      description: 剖切面法向向量 X 分量
    ny:
      type: number
      default: 0.0
      description: 剖切面法向向量 Y 分量
    nz:
      type: number
      default: 0.0
      description: 剖切面法向向量 Z 分量
    state:
      type: integer
      minimum: 1
      default: 1
      description: 结果状态号 (1-based)
    fringe_code:
      type: integer
      minimum: 1
      default: 1
      description: 云图物理量编号
  additionalProperties: false
outputs:
- name: section_fringe.png
  kind: png
