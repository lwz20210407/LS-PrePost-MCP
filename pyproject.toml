[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ls-prepost-mcp"
version = "0.1.0"
description = "Verified native LS-PrePost automation through MCP and agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "LS-PrePost-MCP contributors"}]
dependencies = ["mcp>=1.27,<2", "pillow>=11,<13"]

[project.optional-dependencies]
results = ["lasso-python>=2,<3"]
pydyna = ["ansys-dyna-core==0.12.1"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
ls-prepost-mcp = "ls_prepost_mcp.server:main"
lspp = "ls_prepost_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ls_prepost_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

